mode: deployment

image:
  repository: otel/opentelemetry-collector-k8s
  tag: '0.165.0'

extraEnvsFrom:
  - secretRef:
      name: otel-cloud-dev

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false


config:
  receivers:
    prometheus:
      config:
        scrape_configs:
        - job_name: 'otel-node-exporter'
          scrape_interval: 10s
          static_configs:
          - targets: ['10.43.102.229:9100']

  # processors:
  #   filter/exclude:
  #     metrics:
  #       exclude:
  #         match_type: strict
  #         metric_names:
  #           - node_cpu_seconds_total
  #           - node_filesystem_avail_bytes

  #   # filter/include:
  #   #   metrics:
  #   #     include:
  #   #       match_type: strict
  #   #       metric_names:
  #   #         - node_cpu_seconds_total
  #   #         - node_filesystem_avail_bytes

  #   # filter/include:
  #   #   # any names NOT matching filters are excluded from remainder of pipeline
  #   #   metrics:
  #   #     include:
  #   #       match_type: regexp
  #   #       metric_names:
  #   #         # re2 regexp patterns
  #   #         - node_*

  #   filter/include:
  #     # any names NOT matching filters are excluded from remainder of pipeline
  #     metrics:
  #       include:
  #         match_type: regexp
  #         metric_names:
  #           # re2 regexp patterns
  #           # - prefix/.*
  #           # - prefix_.*
  #           # - .*/suffix
  #           # - .*_suffix
  #           # - .*/contains/.*
  #           - .*_bytes
  #           # - full/name/match
  #           # - full_name_match


  extensions:
    basicauth:
      client_auth: 
        username: "${env:PROCESSORS_LOGS_USERNAME}"
        password: "${env:PROCESSORS_LOGS_PASSWORD}"
    basicauth/2:
      client_auth: 
        username: "${env:PROCESSORS_METRICS_USERNAME}"
        password: "${env:PROCESSORS_METRICS_PASSWORD}"
  exporters:
    otlp_grpc:
      endpoint: "${env:PROCESSORS_TEMPO_ENDPOINT}"
      headers:
          authorization: "${env:PROCESSORS_TEMPO_AUTHORIZATION}"
    otlp_http:
      endpoint: "${env:PROCESSORS_LOKI_ENDPOINT}"
      auth:
        authenticator: basicauth
    otlp_http/2:
      endpoint: "${env:PROCESSORS_PROMETHEUS_ENDPOINT}"
      auth:
        authenticator: basicauth/2

  service:
      extensions: [basicauth,basicauth/2,health_check]
      pipelines:
        traces:
          exporters:
            - otlp_grpc
        logs:
          exporters:
            - otlp_http
        metrics:
          # processors:
          #   # - filter/exclude
          #   - filter/include
          exporters:
            - otlp_http/2